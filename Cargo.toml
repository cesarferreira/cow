[package]
name = "cow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Create cheap independent directory clones"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/cow"

[[bin]]
name = "cow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
